name: Temporary red and green runs of evidence prefixes ignoring case

on:
  push:
    branches:
      - tmp/red-green-evidence-b

permissions:
  contents: read

env:
  REPO: 51degrees-cxx

jobs:
  trial:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Red Ubuntu Release, the tests without the fix', os: ubuntu-latest, config: Release, asan: 'OFF', ref: 'a2d759e857f3820c9d9c475e5214ce974500ac9a' }
          - { name: Green Ubuntu Release, os: ubuntu-latest, config: Release, asan: 'OFF', ref: '' }
          - { name: Green Ubuntu Debug Asan, os: ubuntu-latest, config: Debug, asan: 'ON', ref: '' }
          - { name: Green Windows Release, os: windows-latest, config: Release, asan: 'OFF', ref: '' }
          - { name: Green Windows Debug, os: windows-latest, config: Debug, asan: 'OFF', ref: '' }
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4
        with:
          path: ${{ env.REPO }}
          submodules: true
          ref: ${{ matrix.ref }}
      - name: Build the common tests
        run: |
          git -C $env:REPO log -1 --format='Building %H %s'
          $platform = $IsWindows ? @('-A', 'x64') : @("-DCMAKE_BUILD_TYPE=${{ matrix.config }}")
          cmake -S $env:REPO -B "$env:REPO/build" @platform -DWITH_ASAN=${{ matrix.asan }} -DFIFTYONE_COMMON_CXX_BUILD_TESTING=ON -DFIFTYONE_COMMON_CXX_BUILD_TESTING_IPI=ON | Select-Object -Last 3
          $log = cmake --build "$env:REPO/build" --config ${{ matrix.config }} --parallel 4 --target CommonTests CommonTestsIpi 2>&1
          $code = $LASTEXITCODE
          "Build exit $code"
          if ($code -ne 0) {
            $log | ForEach-Object { "$_" } | Where-Object { $_ -match 'error|multiple definition|warning C' } | Select-Object -First 60 | ForEach-Object { Write-Host $_ }
            throw "The build failed"
          }
      - name: Run the evidence tests
        run: |
          Push-Location "$env:REPO/build"
          $out = ctest -C ${{ matrix.config }} --tests-regex '^Evidence' --output-on-failure --timeout 600 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { "$_" } | Where-Object { $_ -match 'tests passed|Total Test time|\*\*\*Failed|Expected|Which is|actual|has no prefix|was dropped|error' } | ForEach-Object { Write-Host $_ }
          Pop-Location
          exit $code
