name: Temporary build of pull request 99 with the selection

on:
  push:
    branches:
      - 'tmp/pr-matrix-99sel'

jobs:
  Build:
    uses: 51Degrees/common-ci/.github/workflows/nightly-pull-request.yml@pull-request-depth
    with:
      repo-name: 51degrees-cxx
      org-name: 51Degrees
      pull-request-id: 99
      dryrun: 'true'
      branch: rc
      cache-assets: true
      skip-compare-performance: true
      common-ci-ref: pull-request-depth
      fail-fast: false
      full-matrix: false
    secrets:
      token: ${{ secrets.ACCESS_TOKEN }}
      DeviceDetection: ${{ secrets.DEVICE_DETECTION_KEY }}
      DeviceDetectionUrl: ${{ secrets.DEVICE_DETECTION_URL }}
      IpIntelligenceUrl: ${{ secrets.IPI_DATA_FILE_URL }}
