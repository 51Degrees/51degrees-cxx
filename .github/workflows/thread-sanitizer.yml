name: Thread sanitizer

# Builds the common and Device Detection tests with ThreadSanitizer and runs
# the resource manager tests and the Hash reload tests, some of which replace
# a resource while other threads read it. A missing barrier there passes the
# other builds, as x86 orders the loads anyway, and only ThreadSanitizer
# reports it. Any report, and any warning from CMake or the compilers, fails
# the job.
on:
  pull_request:
    branches: [rc, main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - '.github/workflows/thread-sanitizer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tsan:
    name: Thread sanitizer, ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone with the submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      # The tests read the free Lite data file and the evidence, which
      # common-ci's fetch-assets step fetches or restores from the asset cache.
      - name: Fetch the free Device Detection data files
        uses: 51Degrees/common-ci/actions/fetch-assets@main
        with:
          assets: |
            51Degrees-LiteV4.1.hash
            20000 Evidence Records.yml
          cache: 'true'

      - name: Put the data files where the tests look for them
        shell: pwsh
        run: |
          Copy-Item -LiteralPath 'assets/51Degrees-LiteV4.1.hash',
            'assets/20000 Evidence Records.yml' -Destination data/device-detection

      - name: Build the tests with ThreadSanitizer
        # A warning fails the build, as it does every build 51Degrees runs.
        env:
          _51DEGREES_WARNINGS_AS_ERRORS: 'true'
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -D_51DEGREES_WITH_TSAN=ON \
            -D_51DEGREES_BUILD_IP_INTELLIGENCE=OFF 2>&1 | tee build.log
          cmake --build build --target CommonTests HashTests --parallel 4 \
            2>&1 | tee -a build.log
          if grep -nE 'warning:|CMake Warning|CMake Deprecation Warning' \
            build.log; then
            echo "::error::The build gave the warnings above"
            exit 1
          fi

      # ThreadSanitizer can't map its shadow memory with the address space
      # randomization of recent kernels, so the tests run with it turned off.
      - name: Run the resource manager and reload tests
        env:
          TSAN_OPTIONS: halt_on_error=0:second_deadlock_stack=1
        run: |
          setarch "$(uname -m)" -R ctest --test-dir build --output-on-failure \
            --parallel 4 --no-tests=error \
            -R '^(ResourceManager\.|HashReloadTests\.|HashCTests\.Reload|HashFirstReadRuleTests\..*Reload)'
