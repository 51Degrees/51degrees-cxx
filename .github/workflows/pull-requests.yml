name: Pull Requests

on:
  workflow_dispatch:
    inputs:
      dryrun:
        type: boolean
        default: false
      skip-lite-tests:
        description: 'Skip testing with Lite data file'
        type: boolean
        default: false
      common-ci-ref:
        type: string
        default: ''
      full-matrix:
        description: 'Build every configuration, not only those the changes need'
        type: boolean
        default: false

jobs:
  PullRequests:
    name: Pull Requests
    uses: 51Degrees/common-ci/.github/workflows/nightly-pull-requests.yml@main
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
      common-ci-ref: ${{ inputs.common-ci-ref || '' }}
      skip-lite-tests: ${{ inputs.skip-lite-tests || false }}
      cache-assets: true
      # Each pull request is built on the configurations its changes need,
      # as ci/select-options.ps1 chooses, and one that fails does not cancel
      # the others. With nothing eligible, the nightly builds rc instead.
      full-matrix: ${{ inputs.full-matrix || false }}
      fail-fast: false
      build-without-pull-requests: false
    secrets:
      token: ${{ secrets.ACCESS_TOKEN }}
      DeviceDetection: ${{ secrets.DEVICE_DETECTION_KEY }}
      DeviceDetectionUrl: ${{ secrets.DEVICE_DETECTION_URL }}
      IpIntelligenceUrl: ${{ secrets.IPI_DATA_FILE_URL }}
