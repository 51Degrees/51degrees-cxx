name: Temporary no value message tests

on:
  push:
    branches:
      - 'tmp/noreason-*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel 4 --target CommonTests HashTests IpiTests
      - name: Run the new tests
        run: |
          set +e
          rc=0
          build/bin/CommonTests --gtest_filter='ResultsBaseNoValueTests.*' || rc=1
          build/bin/HashTests --gtest_filter='HashNoValueMessages.*' || rc=1
          build/bin/IpiTests --gtest_filter='IpiNoValueMessages.*' || rc=1
          exit $rc
