name: CI script tests

# Runs the tests of the scripts in ci/ when a pull request changes them.
on:
  pull_request:
    branches: [rc, main]
    paths:
      - 'ci/**'
      - '.github/workflows/ci-script-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: CI script tests, ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Run the tests in ci
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = 'ci'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $config
