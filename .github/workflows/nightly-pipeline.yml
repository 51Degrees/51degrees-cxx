name: Nightly Pipeline

on:
  workflow_dispatch:
    inputs:
      dryrun:
        type: boolean
        default: false
      skip-lite-tests:
        description: 'Skip testing with Lite data file'
        type: boolean
        default: false
      common-ci-ref:
        type: string
        default: ''
  schedule:
    - cron: '35 0 * * *'

jobs:
  # The publish builds main, which the pull requests into rc do not change, so
  # it runs before the pull request builds and has the runners first. It waits
  # for the submodule update, which can change main.
  Publish:
    if: ${{ !cancelled() }}
    needs: SubmoduleUpdate
    name: Nightly Publish
    uses: 51Degrees/common-ci/.github/workflows/nightly-publish.yml@main
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
      common-ci-ref: ${{ inputs.common-ci-ref || '' }}
      cache-assets: true
    secrets:
      token: ${{ secrets.ACCESS_TOKEN }}
      DeviceDetection: ${{ secrets.DEVICE_DETECTION_KEY }}
      DeviceDetectionUrl: ${{ secrets.DEVICE_DETECTION_URL }}
      IpIntelligenceUrl: ${{ secrets.IPI_DATA_FILE_URL }}

  SubmoduleUpdate:
    name: Nightly Submodule Update
    uses: 51Degrees/common-ci/.github/workflows/nightly-submodule-update.yml@main
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
      common-ci-ref: ${{ inputs.common-ci-ref || '' }}
    secrets:
      token: ${{ secrets.ACCESS_TOKEN }}

  # Builds the examples from a fresh clone and runs each one with no settings,
  # on the free data files.
  Examples:
    name: Nightly Examples
    uses: ./.github/workflows/examples.yml

  # Compiles the sources with the runner's compiler and its default language
  # standard, which changes without any change here.
  DefaultStandard:
    name: Nightly Default Standard
    uses: ./.github/workflows/default-standard.yml

  PullRequests:
    if: ${{ !cancelled() }}
    needs: [SubmoduleUpdate, Publish]
    name: Nightly Pull Requests
    uses: 51Degrees/common-ci/.github/workflows/nightly-pull-requests.yml@main
    with:
      repo-name: ${{ github.event.repository.name }}
      org-name: ${{ github.event.repository.owner.login }}
      dryrun: ${{ inputs.dryrun || false }}
      common-ci-ref: ${{ inputs.common-ci-ref || '' }}
      skip-lite-tests: ${{ inputs.skip-lite-tests || false }}
      cache-assets: true
      # The sanitizer build takes up to 118 minutes, so each build and test
      # job gets 150 rather than common-ci's 120.
      build-test-timeout-minutes: 150
      # One configuration that fails does not cancel the others.
      fail-fast: false
    secrets:
      token: ${{ secrets.ACCESS_TOKEN }}
      DeviceDetection: ${{ secrets.DEVICE_DETECTION_KEY }}
      DeviceDetectionUrl: ${{ secrets.DEVICE_DETECTION_URL }}
      IpIntelligenceUrl: ${{ secrets.IPI_DATA_FILE_URL }}
