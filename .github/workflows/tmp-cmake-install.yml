name: Temporary CMake install, vcpkg and Conan checks

on:
  push:
    branches:
      - 'tmp/cmake-install'

env:
  # The commit of feature/cmake-install that the port and the recipe build.
  PINNED: 34585ffb7db554a41e4668f7c495ecc68c29ca0e

jobs:
  Hash:
    runs-on: ubuntu-latest
    outputs:
      sha512: ${{ steps.hash.outputs.sha512 }}
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - name: Hash the source archive of the pinned commit
        id: hash
        run: |
          curl -sSfL -o src.tar.gz "https://github.com/51Degrees/51degrees-cxx/archive/$PINNED.tar.gz"
          ls -l src.tar.gz
          echo "sha512=$(sha512sum src.tar.gz | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum src.tar.gz | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"
          tar -tzf src.tar.gz | head -5

  # Configures rc and the branch with Ninja and MSVC, as vcpkg does.
  NinjaMsvc:
    if: false
    strategy:
      fail-fast: false
      matrix:
        ref: [rc, feature/cmake-install]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.ref }}
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Configure with Ninja
        shell: pwsh
        run: |
          cmake -S . -B ninja -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF -DFIFTYONE_BUILD_EXAMPLES=OFF
          if ($LASTEXITCODE -ne 0) { throw "Configure of ${{ matrix.ref }} failed" }
          cmake --build ninja
          if ($LASTEXITCODE -ne 0) { throw "Build of ${{ matrix.ref }} failed" }

  InstallCheck:
    if: false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install check
        run: |
          ./ci/check-install.ps1 -RepoName . -Products dd, ipi -Options @(
            '-DFIFTYONE_BUILD_DEVICE_DETECTION=ON'
            '-DFIFTYONE_BUILD_IP_INTELLIGENCE=ON'
            '-DFIFTYONE_IPI_SYMBOLS=ON'
            '-DFIFTYONE_CXX_BOTH_PRODUCTS=ON')
      - name: Names the -complete libraries export
        if: runner.os == 'Linux'
        run: |
          foreach ($lib in 'device-detection', 'ip-intelligence') {
            $file = "build-install/build/lib/libfiftyone-$lib-complete.so"
            $all = @(nm -D --defined-only $file)
            $ours = @($all | Select-String -SimpleMatch 'fiftyoneDegrees')
            Write-Output "$file exports $($all.Count) names, $($ours.Count) of them 51Degrees names"
          }

  Vcpkg:
    if: false
    needs: Hash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, triplet: x64-linux, consumer: run }
          - { os: ubuntu-latest, triplet: x64-linux-dynamic, consumer: run }
          - { os: ubuntu-latest, triplet: arm64-android, consumer: build }
          - { os: windows-latest, triplet: x64-windows, consumer: run }
          - { os: windows-latest, triplet: x64-windows-static, consumer: run }
          - { os: windows-latest, triplet: x86-windows, consumer: run }
          - { os: windows-latest, triplet: arm64-windows, consumer: build }
          - { os: windows-latest, triplet: x64-uwp, consumer: none }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - name: Get vcpkg
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          git -C "$env:RUNNER_TEMP/vcpkg" log -1 --format='vcpkg at %H %cs'
          $bootstrap = $IsWindows ? 'bootstrap-vcpkg.bat' : 'bootstrap-vcpkg.sh'
          & "$env:RUNNER_TEMP/vcpkg/$bootstrap" -disableMetrics
      - name: Check the manifest is formatted
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:RUNNER_TEMP/vcpkg/vcpkg" format-manifest packaging/vcpkg/51degrees/vcpkg.json
          git diff --exit-code packaging/vcpkg
      - name: Fill in the archive hash if the port has none yet
        run: |
          $portfile = 'packaging/vcpkg/51degrees/portfile.cmake'
          (Get-Content -Raw $portfile).Replace(
            'SHA512 0', 'SHA512 ${{ needs.Hash.outputs.sha512 }}') |
            Set-Content -NoNewline $portfile
          Select-String -Path $portfile -Pattern 'REF|SHA512'
      - name: Install the port
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:RUNNER_TEMP/vcpkg/vcpkg" install 51degrees `
            --overlay-ports=packaging/vcpkg --triplet ${{ matrix.triplet }}
          Get-Content "$env:RUNNER_TEMP/vcpkg/installed/vcpkg/info/51degrees_*_${{ matrix.triplet }}.list"
      - name: Show the build logs
        if: failure()
        run: |
          Get-ChildItem -Recurse "$env:RUNNER_TEMP/vcpkg/buildtrees/51degrees" -Filter *.log |
            ForEach-Object { Write-Output "=== $_"; Get-Content $_ -Tail 60 }
      - name: Build test/install with the vcpkg toolchain
        if: matrix.consumer != 'none'
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $arguments = @(
            '-S', 'test/install', '-B', 'consumer'
            "-DCMAKE_TOOLCHAIN_FILE=$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake"
            '-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}'
            '-DCMAKE_BUILD_TYPE=Release'
            '-DEXPECTED_VERSION=4.5.102')
          switch ('${{ matrix.triplet }}') {
            'x86-windows' { $arguments += '-A', 'Win32' }
            'arm64-windows' { $arguments += '-A', 'ARM64' }
            'arm64-android' {
              $arguments += "-DVCPKG_CHAINLOAD_TOOLCHAIN_FILE=$env:ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"
              $arguments += '-DANDROID_ABI=arm64-v8a'
              # The port's libraries are built for API level 28.
              $arguments += '-DANDROID_PLATFORM=android-28'
            }
            default { if ($IsWindows) { $arguments += '-A', 'x64' } }
          }
          if ('${{ matrix.triplet }}' -eq 'x64-windows-static') {
            $arguments += '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'
          }
          cmake @arguments
          cmake --build consumer --config Release
          if ('${{ matrix.consumer }}' -ne 'run') {
            Write-Output 'Built for another platform, so not run'
            exit 0
          }
          $bin = $IsWindows ? 'consumer/Release' : 'consumer'
          foreach ($program in 'dd-c', 'dd-cxx', 'ipi-c', 'ipi-cxx') {
            Write-Output "Running $program"
            & "$bin/$program"
          }

  Conan:
    if: false
    needs: Hash
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, args: '-s build_type=Release', invalid: false }
          - { os: ubuntu-latest, args: '-s build_type=Debug', invalid: false }
          - { os: ubuntu-latest, args: '-s build_type=Release -o "&:shared=True"', invalid: false }
          - { os: windows-latest, args: '-s build_type=Release -s compiler.cppstd=17', invalid: false }
          - { os: windows-latest, args: '-s build_type=Debug -s compiler.cppstd=17', invalid: false }
          - { os: windows-latest, args: '-s build_type=Release -s compiler.cppstd=17 -o "&:shared=True"', invalid: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
      - name: Install Conan
        run: |
          pip install "conan>=2.0.9,<3"
          conan --version
          conan profile detect
          conan profile show
      - name: Fill in the archive hash if the recipe has none yet
        run: |
          $data = 'packaging/conan/51degrees/all/conandata.yml'
          (Get-Content -Raw $data).Replace(('0' * 64),
            '${{ needs.Hash.outputs.sha256 }}') | Set-Content -NoNewline $data
          Get-Content $data
      - name: Create the package
        run: |
          $output = conan create packaging/conan/51degrees/all `
            --version 4.5.102.cci.20261104 --build=missing ${{ matrix.args }} 2>&1
          $code = $LASTEXITCODE
          $output | Write-Output
          if ('${{ matrix.invalid }}' -eq 'true') {
            if ($code -eq 0 -or !($output -match 'cannot be built as a shared library on Windows')) {
              throw 'Expected the recipe to refuse a shared build on Windows'
            }
            Write-Output 'The recipe refused a shared build on Windows, as it should'
            exit 0
          }
          exit $code

  ConanLint:
    if: false
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      # The last commit with Conan Center's whole in-repo linter, 19 September
      # 2024. Its plugins went the next day and the rest on 4 November 2024,
      # when the checks moved to Conan Center's own service.
      CCI: 2ee7947fd090162737149b7abdcd49302ba3821d
      # Conan Center's CMake package template, linted the same way as a
      # control, at its commit of 4 November 2026.
      TEMPLATE: 179568aa426a7197b270cad44ac35ae26afb469b
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Get the linter
        run: |
          pip install pylint==2.14 conan==2.7.1 yamllint strictyaml
          mkdir linter
          for f in __init__.py check_import_tools.py check_layout_src_folder.py \
            check_package_name.py check_version_attribute.py conandata_yaml_linter.py \
            conanv2_transition.py config_yaml_linter.py pylintrc_recipe \
            pylintrc_testpackage transform_conanfile.py transform_imports.py \
            yaml_linting.py yamllint_rules.yml; do
            curl -sSfL -o "linter/$f" \
              "https://raw.githubusercontent.com/conan-io/conan-center-index/$CCI/linter/$f"
          done
      - name: Get the template
        run: |
          base="https://raw.githubusercontent.com/conan-io/conan-center-index/$TEMPLATE/docs/package_templates/cmake_package/all"
          mkdir -p template/test_package
          curl -sSfL -o template/conanfile.py "$base/conanfile.py"
          curl -sSfL -o template/test_package/conanfile.py "$base/test_package/conanfile.py"
      - name: Lint the recipe and the template
        run: |
          lint() {
            pylint --rcfile="linter/$1" --output-format=parseable --exit-zero "$2" |
              tee /dev/stderr | grep -E '^[^ ]+:[0-9]+: \[' > "$3" || true
          }
          lint pylintrc_recipe packaging/conan/51degrees/all/conanfile.py recipe.txt
          lint pylintrc_recipe template/conanfile.py recipe-template.txt
          lint pylintrc_testpackage packaging/conan/51degrees/all/test_package/conanfile.py test.txt
          lint pylintrc_testpackage template/test_package/conanfile.py test-template.txt
          # A finding the template also gets comes from running a linter
          # written for Conan 1, so only the others count.
          python3 - <<'EOF'
          import re, sys
          def findings(path):
              keys = set()
              for line in open(path):
                  m = re.match(r"^[^ ]+:\d+: \[(\w+)\([^)]*\)[^\]]*\] (.*)$", line.strip())
                  if m:
                      text = re.sub(r"'\w+Conan'", "'<recipe class>'", m.group(2))
                      keys.add((m.group(1), text))
              return keys
          failed = False
          for mine, template in (("recipe.txt", "recipe-template.txt"), ("test.txt", "test-template.txt")):
              own = findings(mine) - findings(template)
              print(f"{mine}: {len(findings(mine))} findings, {len(own)} not also in the template")
              for code, text in sorted(own):
                  print(f"  {code} {text}")
                  failed = True
          sys.exit(1 if failed else 0)
          EOF
      - name: Lint the YAML files
        if: always()
        run: |
          yamllint --config-file linter/yamllint_rules.yml -f standard \
            packaging/conan/51degrees/config.yml packaging/conan/51degrees/all/conandata.yml
          python3 linter/config_yaml_linter.py packaging/conan/51degrees/config.yml
          python3 linter/conandata_yaml_linter.py packaging/conan/51degrees/all/conandata.yml
          echo "The YAML files pass"

  # Every macOS check on one runner, one after another, as the organisation
  # has five macOS runners.
  MacOS:
    needs: Hash
    runs-on: macos-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install check
        if: false
        run: |
          sw_vers
          ./ci/check-install.ps1 -RepoName . -Products dd, ipi -Options @(
            '-DFIFTYONE_BUILD_DEVICE_DETECTION=ON'
            '-DFIFTYONE_BUILD_IP_INTELLIGENCE=ON'
            '-DFIFTYONE_IPI_SYMBOLS=ON'
            '-DFIFTYONE_CXX_BOTH_PRODUCTS=ON')
      - name: Install the vcpkg port for arm64-osx
        if: ${{ !cancelled() }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/vcpkg"
          git -C "$env:RUNNER_TEMP/vcpkg" log -1 --format='vcpkg at %H %cs'
          & "$env:RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          $portfile = 'packaging/vcpkg/51degrees/portfile.cmake'
          (Get-Content -Raw $portfile).Replace(
            'SHA512 0', 'SHA512 ${{ needs.Hash.outputs.sha512 }}') |
            Set-Content -NoNewline $portfile
          & "$env:RUNNER_TEMP/vcpkg/vcpkg" install 51degrees `
            --overlay-ports=packaging/vcpkg --triplet arm64-osx
          cmake -S test/install -B consumer-vcpkg `
            "-DCMAKE_TOOLCHAIN_FILE=$env:RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            '-DVCPKG_TARGET_TRIPLET=arm64-osx' '-DCMAKE_BUILD_TYPE=Release' `
            '-DEXPECTED_VERSION=4.5.102'
          cmake --build consumer-vcpkg
          foreach ($program in 'dd-c', 'dd-cxx', 'ipi-c', 'ipi-cxx') {
            Write-Output "Running $program"
            & "consumer-vcpkg/$program"
            if ($LASTEXITCODE -ne 0) { throw "$program failed" }
          }
      - name: Show the vcpkg build logs
        if: failure()
        run: |
          Get-ChildItem -Recurse "$env:RUNNER_TEMP/vcpkg/buildtrees/51degrees" -Filter *.log |
            ForEach-Object { Write-Output "=== $_"; Get-Content $_ -Tail 60 }
      - name: Create the Conan package
        if: false
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          pip install "conan>=2.0.9,<3"
          conan profile detect
          conan profile show
          $data = 'packaging/conan/51degrees/all/conandata.yml'
          (Get-Content -Raw $data).Replace(('0' * 64),
            '${{ needs.Hash.outputs.sha256 }}') | Set-Content -NoNewline $data
          conan create packaging/conan/51degrees/all `
            --version 4.5.102.cci.20261104 --build=missing -s build_type=Release
          if ($LASTEXITCODE -ne 0) { throw 'conan create failed' }
